<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warcraft Logs Raid Performance & Pull Comparison</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-dark: #12131a;
      --card-bg: #1c1e29;
      --border: #2e3245;
      --text-main: #e2e8f0;
      --text-muted: #94a3b8;
      --primary: #6366f1;
      --accent-dps: #ef4444;
      --accent-hps: #10b981;
      --accent-overheal: #f59e0b;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 1.5rem; color: #fff; }
    .nav-tabs { display: flex; gap: 8px; }
    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .tab-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
    .card-title { font-size: 0.875rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px; }
    .card-value { font-size: 1.5rem; font-weight: bold; }
    .delta { font-size: 0.875rem; color: var(--accent-hps); margin-top: 4px; }
    .delta.negative { color: var(--accent-dps); }
    .chart-container { position: relative; height: 380px; width: 100%; margin-top: 16px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
  </style>
</head>
<body>

  <div class="header">
    <h1>Warcraft Logs Raid Analyzer</h1>
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('timeline')">Timeline View</button>
      <button class="tab-btn" onclick="switchTab('comparison')">Fight-over-Fight</button>
    </div>
  </div>

  <!-- TIMELINE VIEW TAB -->
  <div id="timeline" class="tab-content active">
    <div class="grid">
      <div class="card">
        <div class="card-title">Peak Raid DPS</div>
        <div class="card-value" style="color: var(--accent-dps)">14.2M</div>
      </div>
      <div class="card">
        <div class="card-title">Peak Effective HPS</div>
        <div class="card-value" style="color: var(--accent-hps)">8.9M</div>
      </div>
      <div class="card">
        <div class="card-title">Avg Overheal Waste</div>
        <div class="card-value" style="color: var(--accent-overheal)">34.2%</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Encounter Performance Timeline (DPS, HPS & Overhealing)</div>
      <div class="chart-container">
        <canvas id="timelineChart"></canvas>
      </div>
    </div>
  </div>

  <!-- FIGHT OVER FIGHT TAB -->
  <div id="comparison" class="tab-content">
    <div class="grid">
      <div class="card">
        <div class="card-title">DPS Delta (Pull 1 vs Kill)</div>
        <div class="card-value">+1.8M</div>
        <div class="delta">+14.2% Raid Damage</div>
      </div>
      <div class="card">
        <div class="card-title">Overheal Reduction</div>
        <div class="card-value">-8.4%</div>
        <div class="delta">Improved Mana Efficiency</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Pull-over-Pull Throughput Comparison</div>
      <div class="chart-container">
        <canvas id="comparisonChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    const labels = ['0:00', '1:00', '2:00', '3:00', '4:00', '5:00', '6:00', '7:00'];

    // Timeline Chart
    new Chart(document.getElementById('timelineChart'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [
          { label: 'Damage (DPS)', data: [12, 14.2, 10.5, 11, 13.8, 9.5, 14, 12.5], borderColor: '#ef4444', tension: 0.3, fill: false },
          { label: 'Effective Healing (HPS)', data: [4, 5.2, 8.9, 4.5, 6.2, 8.1, 5, 4.2], borderColor: '#10b981', tension: 0.3, fill: false },
          { label: 'Overhealing', data: [2, 1.8, 4.1, 2.2, 3.0, 4.5, 2.1, 1.9], borderColor: '#f59e0b', tension: 0.3, borderDash: [5, 5], fill: false }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });

    // Comparison Chart
    new Chart(document.getElementById('comparisonChart'), {
      type: 'bar',
      data: {
        labels: ['Pull 1 (Wipe 12%)', 'Pull 2 (Wipe 4%)', 'Pull 3 (Kill)'],
        datasets: [
          { label: 'Raid DPS (M)', data: [11.5, 12.8, 13.3], backgroundColor: '#ef4444' },
          { label: 'Raid HPS (M)', data: [6.8, 6.4, 6.1], backgroundColor: '#10b981' },
          { label: 'Overheal %', data: [42.6, 38.1, 34.2], backgroundColor: '#f59e0b' }
        ]
      },
      options: { responsive: true, maintainAspectRatio: false }
    });
  </script>
</body>
</html>
